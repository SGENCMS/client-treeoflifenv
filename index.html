    <script>
    $(function() {
        $('#ageSelectYes, #ageSelectNo').on('change', function() {
            // Make checkboxes behave like radio buttons
            if (this.id === 'ageSelectYes') {
                $('#ageSelectNo').prop('checked', false);
            } else {
                $('#ageSelectYes').prop('checked', false);
            }

            // Check if "No" is selected
            if ($('#ageSelectNo').is(':checked')) {
                $('.location-select .ctas a').attr('href', 'https://www.google.com');
            } else {
                $('.location-select .ctas a').each(function() {
                    const original = $(this).data('original-href');
                    $(this).attr('href', original ? original : '');
                });
            }
        });

        // Save original hrefs on load
        $('.location-select .ctas a').each(function() {
            $(this).data('original-href', $(this).attr('href'));
        });
    });
</script>
